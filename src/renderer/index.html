<!doctype html>
<html lang="en" data-theme="dark" data-accent="violet">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
  />
  <title>Kontest Tracker</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/themes.css" />
  <link rel="stylesheet" href="./styles/layout.css" />
  <link rel="stylesheet" href="./styles/components.css" />
</head>
<body>
  <div id="widget">
    <header id="titlebar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">Kontest</span>
      </div>
      <div class="titlebar-actions">
        <button id="btn-refresh" class="icon-btn" title="Refresh now" aria-label="Refresh contests"></button>
        <button id="btn-pin" class="icon-btn" title="Always on top" aria-label="Toggle always on top"></button>
        <button id="btn-close" class="icon-btn" title="Hide widget" aria-label="Hide widget"></button>
      </div>
    </header>

    <nav id="tabs" role="tablist">
      <button class="tab active" data-view="contests" role="tab">Contests</button>
      <button class="tab" data-view="daily" role="tab">Tracker</button>
      <button class="tab" data-view="filters" role="tab">Filters</button>
      <button class="tab" data-view="settings" role="tab">Settings</button>
    </nav>

    <main id="views">
      <section class="view" id="view-contests" role="tabpanel"></section>
      <section class="view" id="view-daily" role="tabpanel" hidden></section>
      <section class="view" id="view-filters" role="tabpanel" hidden></section>
      <section class="view" id="view-settings" role="tabpanel" hidden></section>
    </main>

    <footer id="statusbar">
      <div id="source-dots" aria-label="Source status"></div>
      <div id="status-msg" role="status"></div>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
